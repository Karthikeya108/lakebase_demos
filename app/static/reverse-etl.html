<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reverse ETL Demo - Lakebase Autoscaling</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #10b981; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .new-row { background-color: #ecfdf5 !important; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <!-- Header -->
    <div class="mb-6">
      <div class="flex items-center gap-3">
        <a href="/" class="text-gray-400 hover:text-gray-600 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </a>
        <h1 class="text-3xl font-bold text-gray-900">Reverse ETL Demo</h1>
      </div>
      <p class="text-gray-500 mt-1 ml-8">Sync Delta Lake data to Lakebase Postgres via <a href="https://learn.microsoft.com/en-us/azure/databricks/oltp/projects/sync-tables" target="_blank" class="text-blue-600 hover:underline">Synced Tables API</a></p>
    </div>

    <!-- Status Banner -->
    <div id="status-banner" class="mb-6 rounded-lg shadow p-4 bg-gray-100 border border-gray-200">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div id="status-dot" class="w-3 h-3 rounded-full bg-gray-400"></div>
          <span id="status-text" class="font-medium text-gray-600">Checking status...</span>
          <span id="status-detail" class="text-sm text-gray-400"></span>
          <span id="pipeline-link"></span>
        </div>
        <div id="status-buttons" class="flex gap-3"></div>
      </div>
    </div>

    <!-- Actions (visible when synced) -->
    <div id="actions-panel" class="hidden mb-4">
      <div class="flex items-center gap-3 flex-wrap">
        <button onclick="insertRow()"
          class="px-4 py-2 rounded-lg bg-blue-500 text-white text-sm font-medium hover:bg-blue-600 transition-colors">
          Add Row to Delta
        </button>
        <button onclick="triggerSync()"
          class="px-4 py-2 rounded-lg bg-green-500 text-white text-sm font-medium hover:bg-green-600 transition-colors">
          Trigger Sync
        </button>
        <span id="action-result" class="text-sm text-gray-500"></span>
      </div>
    </div>

    <!-- Side-by-side comparison -->
    <div id="compare-container" class="hidden">
      <div class="grid grid-cols-2 gap-4">
        <!-- Source (Delta) -->
        <div>
          <div class="bg-blue-600 text-white rounded-t-lg px-4 py-2 flex items-center justify-between">
            <span class="font-medium">Source: Delta Lake</span>
            <span id="src-meta" class="text-sm opacity-80"></span>
          </div>
          <div class="bg-white rounded-b-lg shadow overflow-x-auto">
            <div id="src-table"></div>
          </div>
        </div>
        <!-- Target (Lakebase) -->
        <div>
          <div class="bg-green-600 text-white rounded-t-lg px-4 py-2 flex items-center justify-between">
            <span class="font-medium">Target: Lakebase Postgres</span>
            <span id="tgt-meta" class="text-sm opacity-80"></span>
          </div>
          <div class="bg-white rounded-b-lg shadow overflow-x-auto">
            <div id="tgt-table"></div>
          </div>
        </div>
      </div>

      <!-- Pagination -->
      <div id="pagination" class="hidden flex items-center justify-center mt-4 gap-4 bg-white rounded-lg shadow p-3">
        <button id="btn-prev" onclick="changePage(-1)" class="px-3 py-1 rounded border text-sm hover:bg-gray-50 disabled:opacity-50">Previous</button>
        <span id="page-info" class="text-sm text-gray-600"></span>
        <button id="btn-next" onclick="changePage(1)" class="px-3 py-1 rounded border text-sm hover:bg-gray-50 disabled:opacity-50">Next</button>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden p-8 text-center">
      <div class="spinner mx-auto mb-2"></div>
      <p id="loading-text" class="text-gray-500">Loading...</p>
    </div>
  </div>

  <script>
    let currentPage = 1;
    const PAGE_SIZE = 25;
    let syncedActive = false;
    let sourceExists = false;
    let pollTimer = null;

    function init() { checkStatus(); }

    function showLoading(text) {
      document.getElementById('loading-text').textContent = text;
      document.getElementById('loading').classList.remove('hidden');
    }
    function hideLoading() { document.getElementById('loading').classList.add('hidden'); }

    function startPolling() { stopPolling(); pollTimer = setInterval(checkStatus, 10000); }
    function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

    function formatStatusMessage(msg) {
      if (!msg) return '';
      return msg;
    }

    async function checkStatus() {
      try {
        const res = await fetch('/api/retl/status');
        const data = await res.json();
        sourceExists = data.source_exists;
        syncedActive = data.synced;
        updateStatusUI(data);
        if (sourceExists) loadComparison();
      } catch (e) {
        setStatus('error', 'Failed to check status', e.message, []);
      }
    }

    function updateStatusUI(data) {
      document.getElementById('pipeline-link').innerHTML = '';

      if (!data.source_exists) {
        stopPolling();
        setStatus('inactive', 'Source table not created', '', [
          { label: 'Setup Source Table', onclick: 'setupSource()', color: 'bg-blue-600 hover:bg-blue-700' }
        ]);
        document.getElementById('actions-panel').classList.add('hidden');
        document.getElementById('compare-container').classList.add('hidden');
        return;
      }

      if (!data.synced) {
        stopPolling();
        setStatus('source-only', `Source ready — ${data.source_count} rows`, '', [
          { label: 'Create Synced Table', onclick: 'createSync()', color: 'bg-green-600 hover:bg-green-700' }
        ]);
        document.getElementById('actions-panel').classList.add('hidden');
        return;
      }

      const syncState = data.sync_status ? data.sync_status.state : 'UNKNOWN';
      const syncMsg = data.sync_status ? data.sync_status.message : '';

      // Pipeline hyperlink
      if (data.sync_status && data.sync_status.pipeline_url) {
        document.getElementById('pipeline-link').innerHTML =
          `<a href="${data.sync_status.pipeline_url}" target="_blank" class="text-xs text-blue-600 hover:underline">View Pipeline</a>`;
      }

      let stateColor;
      if (syncState === 'SYNCED') { stateColor = 'synced'; stopPolling(); }
      else if (syncState === 'PROVISIONING') { stateColor = 'provisioning'; startPolling(); }
      else if (syncState === 'SYNCING') { stateColor = 'syncing'; startPolling(); }
      else if (syncState === 'FAILED') { stateColor = 'error'; stopPolling(); }
      else { stateColor = 'syncing'; startPolling(); }

      setStatus(stateColor, `Synced table — ${syncState}`, formatStatusMessage(syncMsg), [
        { label: 'Delete', onclick: 'deleteSync()', color: 'bg-red-500 hover:bg-red-600' }
      ]);
      document.getElementById('actions-panel').classList.remove('hidden');
    }

    function setStatus(state, text, detail, buttons) {
      const banner = document.getElementById('status-banner');
      const dot = document.getElementById('status-dot');
      const colors = {
        'inactive': { banner: 'bg-gray-100 border-gray-200', dot: 'bg-gray-400', text: 'text-gray-600' },
        'source-only': { banner: 'bg-blue-50 border-blue-200', dot: 'bg-blue-500', text: 'text-blue-700' },
        'provisioning': { banner: 'bg-purple-50 border-purple-200', dot: 'bg-purple-500 animate-pulse', text: 'text-purple-700' },
        'syncing': { banner: 'bg-amber-50 border-amber-200', dot: 'bg-amber-500 animate-pulse', text: 'text-amber-700' },
        'synced': { banner: 'bg-green-50 border-green-200', dot: 'bg-green-500', text: 'text-green-700' },
        'error': { banner: 'bg-red-50 border-red-200', dot: 'bg-red-500', text: 'text-red-700' },
      };
      const c = colors[state] || colors.inactive;
      banner.className = `mb-6 rounded-lg shadow p-4 ${c.banner}`;
      dot.className = `w-3 h-3 rounded-full ${c.dot}`;
      document.getElementById('status-text').className = `font-medium ${c.text}`;
      document.getElementById('status-text').textContent = text;
      document.getElementById('status-detail').innerHTML = detail;

      const btnContainer = document.getElementById('status-buttons');
      btnContainer.innerHTML = buttons.map(b =>
        `<button onclick="${b.onclick}" class="px-3 py-1.5 rounded-lg ${b.color} text-white font-medium transition-colors text-sm">${b.label}</button>`
      ).join('');
    }

    async function setupSource() {
      showLoading('Creating source Delta table...');
      try {
        const res = await fetch('/api/retl/setup-source', { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
        await checkStatus();
      } catch (err) { alert('Setup failed: ' + err.message); }
      finally { hideLoading(); }
    }

    async function createSync() {
      showLoading('Creating synced table...');
      try {
        const res = await fetch('/api/retl/create-sync', { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
        startPolling();
        await checkStatus();
      } catch (err) { alert('Failed to create synced table: ' + err.message); }
      finally { hideLoading(); }
    }

    async function deleteSync() {
      if (!confirm('Delete the synced table and drop the Postgres table?')) return;
      showLoading('Deleting synced table...');
      try {
        const res = await fetch('/api/retl/delete-sync', { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
        stopPolling();
        await checkStatus();
      } catch (err) { alert('Failed to delete: ' + err.message); }
      finally { hideLoading(); }
    }

    async function insertRow() {
      const resultEl = document.getElementById('action-result');
      resultEl.innerHTML = '<div class="spinner inline-block mr-2"></div> Inserting...';
      try {
        const res = await fetch('/api/retl/insert', { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        resultEl.innerHTML = `<span class="text-blue-600">${data.message}</span>`;
        loadComparison();
      } catch (err) { resultEl.innerHTML = `<span class="text-red-500">${err.message}</span>`; }
    }

    async function triggerSync() {
      const resultEl = document.getElementById('action-result');
      resultEl.innerHTML = '<div class="spinner inline-block mr-2"></div> Triggering sync...';
      try {
        const res = await fetch('/api/retl/trigger-sync', { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        resultEl.innerHTML = `<span class="text-green-600">${data.message}</span>`;
        startPolling();
      } catch (err) { resultEl.innerHTML = `<span class="text-red-500">${err.message}</span>`; }
    }

    async function loadComparison() {
      document.getElementById('compare-container').classList.add('hidden');
      try {
        const res = await fetch(`/api/retl/compare?page=${currentPage}&page_size=${PAGE_SIZE}`);
        if (!res.ok) return;
        const data = await res.json();

        renderTable('src', data.source);
        document.getElementById('src-meta').textContent = `${data.source.total_count.toLocaleString()} rows · ${data.source.elapsed_ms.toFixed(0)} ms`;

        if (data.target.rows.length > 0 || syncedActive) {
          renderTable('tgt', data.target);
          document.getElementById('tgt-meta').textContent = data.target.total_count > 0
            ? `${data.target.total_count.toLocaleString()} rows · ${data.target.elapsed_ms.toFixed(0)} ms`
            : 'Waiting for initial sync...';
        } else {
          document.getElementById('tgt-table').innerHTML = '<p class="p-4 text-center text-gray-400">No synced table yet</p>';
          document.getElementById('tgt-meta').textContent = '';
        }

        // Highlight rows in source missing from target
        if (data.target.rows.length > 0) {
          const tgtIds = new Set(data.target.rows.map(r => String(r.id)));
          document.querySelectorAll('#src-table tr[data-id]').forEach(tr => {
            if (!tgtIds.has(tr.dataset.id)) tr.querySelectorAll('td').forEach(td => td.classList.add('new-row'));
          });
        }

        // Pagination
        const maxTotal = Math.max(data.source.total_count, data.target.total_count || 0);
        const totalPages = Math.ceil(maxTotal / PAGE_SIZE);
        const pag = document.getElementById('pagination');
        if (totalPages > 1) {
          pag.classList.remove('hidden');
          document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
          document.getElementById('btn-prev').disabled = currentPage <= 1;
          document.getElementById('btn-next').disabled = currentPage >= totalPages;
        } else { pag.classList.add('hidden'); }

        document.getElementById('compare-container').classList.remove('hidden');
      } catch (err) {}
    }

    function renderTable(prefix, data) {
      const container = document.getElementById(`${prefix}-table`);
      if (!data.rows || !data.rows.length) {
        container.innerHTML = '<p class="p-4 text-center text-gray-400">No data</p>';
        return;
      }
      let html = '<table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-50"><tr>';
      data.columns.forEach(col => {
        html += `<th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">${col}</th>`;
      });
      html += '</tr></thead><tbody class="divide-y divide-gray-200">';
      data.rows.forEach(row => {
        html += `<tr data-id="${row.id || ''}">`;
        data.columns.forEach(col => {
          const val = row[col] !== null && row[col] !== undefined ? row[col] : '';
          const formatted = typeof val === 'number' && col !== 'id' && col !== 'total_policies'
            ? Number(val).toLocaleString(undefined, { minimumFractionDigits: col.includes('amount') || col.includes('premium') ? 2 : 0 })
            : val;
          html += `<td class="px-3 py-1.5 text-xs text-gray-700 whitespace-nowrap">${formatted === '' ? '<span class="text-gray-300">—</span>' : formatted}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function changePage(delta) { currentPage += delta; loadComparison(); }

    init();
  </script>
</body>
</html>
