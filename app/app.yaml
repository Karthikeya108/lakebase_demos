command:
  - uvicorn
  - main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: DBSQL_WAREHOUSE_ID
    value: "<populated-by-setup-job>"
  - name: LAKEBASE_HOST
    value: "<populated-by-setup-job>"
  - name: LAKEBASE_DB
    value: "<populated-by-setup-job>"
  - name: LAKEBASE_ENDPOINT
    value: "<populated-by-setup-job>"
  - name: UC_CATALOG
    value: "<populated-by-setup-job>"
  - name: UC_SCHEMA
    value: "<populated-by-setup-job>"
  - name: LAKEBASE_DATA_API_URL
    value: "<populated-by-setup-job>"
