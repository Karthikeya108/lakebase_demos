bundle:
  name: lakebase-demos

include:
  - resources/*.yml

variables:
  catalog:
    default: "lakebase_demos"
  schema:
    default: "lakebase_demo"
  lakebase_project:
    default: "lakebase-demos"
  lakebase_db:
    default: "lakebase_demos"

targets:
  dev:
    default: true
    mode: development

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
