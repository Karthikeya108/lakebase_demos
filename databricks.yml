bundle:
  name: lakebase-demos

include:
  - resources/*.yml

variables:
  catalog:
    default: "lakebase_demos"
  schema:
    default: "lakebase_demo"
  lakebase_project:
    default: "lakebase-demos"
  lakebase_db:
    default: "lakebase_demos"
targets:
  dev:
    default: true
    mode: development
    workspace: &workspace_config
      host: https://adb-4116661263058619.19.azuredatabricks.net
      profile: uc-demo-ws-ne

  prod:
    mode: production
    workspace:
      <<: *workspace_config
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
